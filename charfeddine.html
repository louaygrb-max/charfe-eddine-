<style>
:root{--gold:#b8913a;--gold2:#e0c070;--green:#0f3d2e;--green2:#1b5a43;--bg:#0a2a1f;--card:#fbf6ea;--text:#173a2d;--muted:#6b7d70;--border:#e6dcc3;box-sizing:border-box}
*{box-sizing:border-box}
html{height:100%}
body{margin:0;min-height:100%;background:radial-gradient(circle at 50% 0%,var(--green2),var(--bg) 65%) fixed;color:var(--text);font-family:"Cairo","Segoe UI",Tahoma,Arial,sans-serif;line-height:1.9;padding:calc(28px + env(safe-area-inset-top,0px)) 16px calc(28px + env(safe-area-inset-bottom,0px))}
.card{max-width:420px;margin:90px auto 0;background:var(--card);border:2px solid var(--gold);border-radius:28px;padding:84px 22px 26px;text-align:center;position:relative;box-shadow:0 20px 50px rgba(0,0,0,.45);animation:up .6s ease both}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.card{animation:none}}
.avatar{position:absolute;top:-76px;left:50%;transform:translateX(-50%);width:150px;height:150px;border-radius:50%;border:3px solid var(--gold);box-shadow:0 8px 28px rgba(0,0,0,.35);overflow:hidden;background:#000}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
h1{margin:0;font-size:25px;font-weight:800;color:var(--green)}
.job{color:var(--gold);margin:2px 0 0;font-weight:700}
h2{font-size:15px;color:var(--gold);font-weight:700;margin:24px 0 8px;text-align:right;display:flex;align-items:center;gap:10px}
h2::after{content:"";flex:1;height:1px;background:var(--border)}
.about{text-align:right;margin:0;color:var(--text)}
.tags{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.tags span{border:1px solid var(--gold);background:#f3ead2;border-radius:99px;padding:4px 14px;font-weight:700;font-size:15px;color:var(--green)}
.call{display:block;padding:13px;border-radius:14px;background:linear-gradient(135deg,var(--green),var(--green2));color:#fff;text-decoration:none;font-weight:800;font-size:19px;border:1.5px solid var(--gold)}
.soc{display:flex;justify-content:center;gap:16px}
.soc a{width:58px;height:58px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;text-decoration:none;font-size:28px;font-weight:800;border:2px solid var(--gold);transition:transform .15s}
.soc a:hover{transform:scale(1.1)}
.fb{background:#1877f2}.wa{background:#25d366}.ig{background:linear-gradient(45deg,#f9a825,#e1306c,#833ab4)}
.slogan{margin:24px 0 0;color:var(--green);font-weight:700}
</style>
